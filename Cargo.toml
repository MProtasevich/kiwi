[profile.release]
strip = "symbols"
opt-level = "z" # try 3 for speed
lto = "fat"
codegen-units = 1

[workspace]
resolver = "2"
members = [
  "rafty",
]

[workspace.dependencies]
anyhow = { version = "1.0" }
async-trait = "0.1"
chrono = { version = "0.4" , features = ["serde"]}
dashmap = { version = "6.2" }
futures = { version = "0.3" }
log = "0.4"
pretty_env_logger = "0.5"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0" }
serde-saphyr = { version = "1.3" }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
